<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9f2"/>
      <stop offset="50%" stop-color="#eaf3ee"/>
      <stop offset="100%" stop-color="#d6e8de"/>
    </linearGradient>
    <linearGradient id="goldBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#8b5b00"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4d3a"/>
      <stop offset="100%" stop-color="#122e23"/>
    </linearGradient>
    <clipPath id="circleClip3">
      <circle cx="160" cy="160" r="140"/>
    </clipPath>
  </defs>

  <!-- Outer Ring with Gold Accent -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="url(#goldBorder3)" stroke-width="4"/>
  <circle cx="160" cy="160" r="144" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Clipped Avatar Content -->
  <g clip-path="url(#circleClip3)">
    <!-- Background Circle -->
    <rect width="320" height="320" fill="url(#avatarBg3)"/>

    <!-- Subtle Geometric Production Soundwave Pattern in Background -->
    <g opacity="0.25" stroke="#1f4d3a" stroke-width="2">
      <line x1="80" y1="130" x2="80" y2="160"/>
      <line x1="95" y1="110" x2="95" y2="180"/>
      <line x1="110" y1="125" x2="110" y2="165"/>
      <line x1="210" y1="125" x2="210" y2="165"/>
      <line x1="225" y1="110" x2="225" y2="180"/>
      <line x1="240" y1="130" x2="240" y2="160"/>
    </g>

    <!-- Professional Blazer / Sherwani Attire -->
    <path d="M80,320 L95,240 Q160,225 225,240 L240,320 Z" fill="url(#suitGrad)"/>
    <!-- Crisp White Collar and Inner Layer -->
    <polygon points="144,228 160,270 176,228" fill="#ffffff"/>
    <polygon points="152,245 160,265 168,245" fill="#e8a317"/>
    <!-- Lapels -->
    <path d="M128,232 L150,285 L138,320 L100,320 Z" fill="#122e23"/>
    <path d="M192,232 L170,285 L182,320 L220,320 Z" fill="#122e23"/>

    <!-- Neck & Face -->
    <rect x="142" y="185" width="36" height="42" rx="8" fill="#d8a47e"/>
    <ellipse cx="160" cy="150" rx="45" ry="54" fill="#ebb38b"/>

    <!-- Modern Short Haircut & Audio Headset Hint -->
    <path d="M116,138 C116,92 138,82 160,82 C182,82 204,92 204,138 C204,118 194,94 160,94 C126,94 116,118 116,138 Z" fill="#2a1418"/>

    <!-- Subtle Eyebrows & Focused Eyes -->
    <path d="M132,136 Q142,131 148,136" stroke="#2a1418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M172,136 Q178,131 188,136" stroke="#2a1418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="144" r="3.5" fill="#2a1418"/>
    <circle cx="180" cy="144" r="3.5" fill="#2a1418"/>

    <!-- Modern Clean Grooming & Confident Expression -->
    <path d="M145,174 Q160,183 175,174" stroke="#8e1b2e" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Discrete Earpiece / Walkie Talkie headset cue (Operations Pro) -->
    <path d="M205,142 C209,142 212,146 210,152 C208,158 204,160 202,158" fill="none" stroke="#e8a317" stroke-width="2"/>
    <circle cx="210" cy="148" r="2.5" fill="#ffd56b"/>
  </g>

  <!-- Role Badge Pin -->
  <g transform="translate(160, 290)">
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#1f4d3a" stroke="#ffd56b" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Karla', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">OPERATIONS LEAD</text>
  </g>
</svg>
