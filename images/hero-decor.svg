<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4d3a"/>
      <stop offset="60%" stop-color="#143427"/>
      <stop offset="100%" stop-color="#0c2017"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#cf8f10"/>
    </linearGradient>
    <filter id="bokeh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="20" fill="url(#bgGrad2)"/>

  <!-- Ambient Light Orbs (Bokeh) -->
  <g opacity="0.4" filter="url(#bokeh)">
    <circle cx="90" cy="120" r="45" fill="#ffd56b"/>
    <circle cx="310" cy="180" r="55" fill="#e8a317"/>
    <circle cx="160" cy="270" r="60" fill="#ffd56b"/>
    <circle cx="280" cy="340" r="50" fill="#8e1b2e"/>
  </g>

  <!-- Floral & Arch Geometry -->
  <g stroke="url(#goldGrad2)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M70,360 C70,180 330,180 330,360"/>
    <path d="M100,360 C100,210 300,210 300,360"/>
    <path d="M130,360 C130,240 270,240 270,360"/>
  </g>

  <!-- Hanging Chandelier / Bells / Floral Strings -->
  <g stroke="url(#goldGrad2)" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="90" x2="140" y2="210"/>
    <circle cx="140" cy="216" r="6" fill="#ffd56b"/>
    <line x1="200" y1="80" x2="200" y2="240"/>
    <circle cx="200" cy="248" r="8" fill="#ffd56b"/>
    <line x1="260" y1="90" x2="260" y2="210"/>
    <circle cx="260" cy="216" r="6" fill="#ffd56b"/>
  </g>

  <!-- Stage Floral Cluster Motif -->
  <g transform="translate(200, 310)">
    <circle cx="-35" cy="0" r="14" fill="#e8a317" opacity="0.85"/>
    <circle cx="35" cy="0" r="14" fill="#e8a317" opacity="0.85"/>
    <circle cx="0" cy="-25" r="16" fill="#8e1b2e"/>
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad2)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="32" width="138" height="32" rx="16" fill="rgba(255,255,255,0.18)" backdrop-filter="blur(4px)"/>
  <text x="99" y="52" fill="#ffffff" font-family="'Karla', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">DÉCOR &amp; LIGHTS</text>

  <!-- Caption text -->
  <text x="32" y="475" fill="url(#goldGrad2)" font-family="'Fraunces', serif" font-size="24" font-weight="700">Floral Architecture &amp;</text>
  <text x="32" y="505" fill="#ffffff" font-family="'Fraunces', serif" font-size="24" font-weight="700">Stage Illumination</text>
  <text x="32" y="530" fill="rgba(255,255,255,0.75)" font-family="'Karla', sans-serif" font-size="14">Signature Themes &amp; Ambiance</text>
</svg>
