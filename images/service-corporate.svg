<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCorporate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122533"/>
      <stop offset="60%" stop-color="#0b1720"/>
      <stop offset="100%" stop-color="#060c12"/>
    </linearGradient>
    <linearGradient id="goldGradCorp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#b27500"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4d6e"/>
      <stop offset="50%" stop-color="#102f43"/>
      <stop offset="100%" stop-color="#0a1d29"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38a4e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38a4e8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="560" rx="20" fill="url(#bgCorporate)"/>

  <!-- Dynamic Corporate Lighting Beams -->
  <polygon points="120,60 40,380 200,380" fill="url(#beamGrad)"/>
  <polygon points="280,60 200,380 360,380" fill="url(#beamGrad)"/>

  <!-- Truss Rigging at Top -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.2">
    <line x1="40" y1="90" x2="360" y2="90"/>
    <line x1="40" y1="105" x2="360" y2="105"/>
    <path d="M40,90 L60,105 L80,90 L100,105 L120,90 L140,105 L160,90 L180,105 L200,90 L220,105 L240,90 L260,105 L280,90 L300,105 L320,90 L340,105 L360,90"/>
  </g>

  <!-- Giant Curved LED Stage Screen Backdrop -->
  <g transform="translate(200, 210)">
    <rect x="-140" y="-80" width="280" height="150" rx="12" fill="url(#screenGrad)" stroke="url(#goldGradCorp)" stroke-width="2"/>
    <!-- Subtle Screen Graphics / Wave -->
    <path d="M-130,20 Q-60,-40 0,0 Q60,40 130,-10" fill="none" stroke="#38a4e8" stroke-width="2.5" opacity="0.6"/>
    <path d="M-130,40 Q-60,-20 0,20 Q60,60 130,10" fill="none" stroke="url(#goldGradCorp)" stroke-width="1.5" opacity="0.7"/>
    <!-- Central Summit Emblem -->
    <circle cx="0" cy="-20" r="22" fill="none" stroke="url(#goldGradCorp)" stroke-width="2"/>
    <polygon points="-8,-12 12,-20 -8,-28" fill="#ffd56b"/>
    <rect x="-40" y="15" width="80" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
    <rect x="-25" y="28" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Stage Deck & Modern Speaker Podium -->
  <g transform="translate(200, 340)">
    <!-- Main Stage Platform -->
    <polygon points="-160,30 160,30 190,65 -190,65" fill="#1f4d3a" opacity="0.9"/>
    <polygon points="-160,30 160,30 160,35 -160,35" fill="url(#goldGradCorp)"/>
    <!-- Stage Front Edge -->
    <rect x="-190" y="65" width="380" height="20" fill="#0e231b"/>

    <!-- Keynote Podium -->
    <g transform="translate(0, 0)">
      <polygon points="-24,-50 24,-50 16,30 -16,30" fill="#ffffff" opacity="0.9"/>
      <polygon points="-28,-54 28,-54 24,-50 -24,-50" fill="url(#goldGradCorp)"/>
      <rect x="-2" y="-62" width="4" height="12" rx="2" fill="#2a1418"/>
      <!-- Mic Head -->
      <circle cx="0" cy="-64" r="3.5" fill="url(#goldGradCorp)"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="32" width="162" height="32" rx="16" fill="rgba(255,255,255,0.18)" backdrop-filter="blur(4px)"/>
  <text x="111" y="52" fill="#ffffff" font-family="'Karla', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">CORPORATE &amp; MICE</text>

  <!-- Caption text -->
  <text x="32" y="475" fill="url(#goldGradCorp)" font-family="'Fraunces', serif" font-size="24" font-weight="700">Business Summits &amp;</text>
  <text x="32" y="505" fill="#ffffff" font-family="'Fraunces', serif" font-size="24" font-weight="700">Annual Gala Events</text>
  <text x="32" y="530" fill="rgba(255,255,255,0.75)" font-family="'Karla', sans-serif" font-size="14">Product Launches, Seminars &amp; Awards</text>
</svg>
