<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e1b2e"/>
      <stop offset="60%" stop-color="#5a101d"/>
      <stop offset="100%" stop-color="#2a1418"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#b27500"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="20" fill="url(#bgGrad1)"/>

  <!-- Decorative Pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="200" cy="220" r="160"/>
    <circle cx="200" cy="220" r="120"/>
    <circle cx="200" cy="220" r="80"/>
    <path d="M200,60 L200,380 M40,220 L360,220 M87,107 L313,333 M87,333 L313,107"/>
  </g>

  <!-- Traditional Garland (Maalai) Graphic -->
  <g transform="translate(200, 200)">
    <!-- Garland arcs -->
    <path d="M-100,-70 C-110,70 -40,140 0,160 C40,140 110,70 100,-70" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M-100,-70 C-110,70 -40,140 0,160 C40,140 110,70 100,-70" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,8" opacity="0.7"/>

    <!-- Auspicious Jasmine & Marigold dots -->
    <circle cx="-95" cy="-20" r="9" fill="#ffd56b"/>
    <circle cx="-80" cy="40" r="9" fill="#ffffff"/>
    <circle cx="-45" cy="100" r="10" fill="#e8a317"/>
    <circle cx="0" cy="160" r="14" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <circle cx="45" cy="100" r="10" fill="#e8a317"/>
    <circle cx="80" cy="40" r="9" fill="#ffffff"/>
    <circle cx="95" cy="-20" r="9" fill="#ffd56b"/>

    <!-- Sacred Diya / Lamp Motif -->
    <ellipse cx="0" cy="50" rx="36" ry="12" fill="url(#goldGrad)"/>
    <path d="M0,15 Q-14,38 0,48 Q14,38 0,15 Z" fill="#ffd778" filter="url(#softGlow)"/>
    <path d="M0,24 Q-6,36 0,44 Q6,36 0,24 Z" fill="#ffffff"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="32" width="130" height="32" rx="16" fill="rgba(255,255,255,0.18)" backdrop-filter="blur(4px)"/>
  <text x="95" y="52" fill="#ffffff" font-family="'Karla', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">ROYAL WEDDINGS</text>

  <!-- Caption text -->
  <text x="32" y="475" fill="url(#goldGrad)" font-family="'Fraunces', serif" font-size="24" font-weight="700">Sacred Rituals &amp;</text>
  <text x="32" y="505" fill="#ffffff" font-family="'Fraunces', serif" font-size="24" font-weight="700">Grand Celebrations</text>
  <text x="32" y="530" fill="rgba(255,255,255,0.75)" font-family="'Karla', sans-serif" font-size="14">Tamil Nadu Traditional Mandaps</text>
</svg>
