<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a101d"/>
      <stop offset="50%" stop-color="#8e1b2e"/>
      <stop offset="100%" stop-color="#2a1418"/>
    </linearGradient>
    <linearGradient id="goldArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="35%" stop-color="#e8a317"/>
      <stop offset="70%" stop-color="#cf8f10"/>
      <stop offset="100%" stop-color="#8b5b00"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd56b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="480" rx="16" fill="url(#bgStoryGrad)"/>

  <!-- Subtle Traditional Kolam / Geometric Texture -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.2" fill="none">
    <circle cx="320" cy="240" r="220"/>
    <circle cx="320" cy="240" r="160"/>
    <circle cx="320" cy="240" r="100"/>
    <path d="M320,20 L320,460 M100,240 L540,240 M165,85 L475,395 M165,395 L475,85"/>
  </g>

  <!-- Ambient Light Center -->
  <ellipse cx="320" cy="200" rx="200" ry="140" fill="url(#glowGrad)"/>

  <!-- Grand Mandap Pillars and Arch -->
  <g filter="url(#softShadow)">
    <!-- Left Pillar -->
    <rect x="90" y="110" width="36" height="300" rx="6" fill="url(#goldArchGrad)"/>
    <rect x="82" y="100" width="52" height="18" rx="4" fill="#ffd56b"/>
    <rect x="82" y="395" width="52" height="22" rx="4" fill="#8b5b00"/>
    <!-- Pillar Details -->
    <line x1="102" y1="125" x2="102" y2="390" stroke="#ffd56b" stroke-width="2" opacity="0.6"/>
    <line x1="114" y1="125" x2="114" y2="390" stroke="#8b5b00" stroke-width="2" opacity="0.7"/>

    <!-- Right Pillar -->
    <rect x="514" y="110" width="36" height="300" rx="6" fill="url(#goldArchGrad)"/>
    <rect x="506" y="100" width="52" height="18" rx="4" fill="#ffd56b"/>
    <rect x="506" y="395" width="52" height="22" rx="4" fill="#8b5b00"/>
    <!-- Pillar Details -->
    <line x1="526" y1="125" x2="526" y2="390" stroke="#ffd56b" stroke-width="2" opacity="0.6"/>
    <line x1="538" y1="125" x2="538" y2="390" stroke="#8b5b00" stroke-width="2" opacity="0.7"/>

    <!-- Ornate Central Arch -->
    <path d="M90,110 C90,40 220,30 320,30 C420,30 550,40 550,110 C510,75 420,70 320,70 C220,70 130,75 90,110 Z" fill="url(#goldArchGrad)"/>
    <path d="M110,110 C160,70 240,65 320,65 C400,65 480,70 530,110" fill="none" stroke="#ffd56b" stroke-width="3"/>
  </g>

  <!-- Traditional Hanging Jasmine & Marigold Garlands (Maalai) -->
  <g>
    <!-- Main Swag Garland -->
    <path d="M108,120 Q320,240 532,120" fill="none" stroke="#e8a317" stroke-width="12" stroke-linecap="round"/>
    <path d="M108,120 Q320,240 532,120" fill="none" stroke="#ffd56b" stroke-width="4" stroke-dasharray="4,8" opacity="0.9"/>
    
    <!-- Secondary Upper Swag -->
    <path d="M160,110 Q320,185 480,110" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="8,6" opacity="0.85"/>

    <!-- Vertical Drop Garlands -->
    <path d="M150,115 L150,280" stroke="#e8a317" stroke-width="6" stroke-dasharray="10,6"/>
    <circle cx="150" cy="285" r="7" fill="#cf8f10"/>
    
    <path d="M490,115 L490,280" stroke="#e8a317" stroke-width="6" stroke-dasharray="10,6"/>
    <circle cx="490" cy="285" r="7" fill="#cf8f10"/>

    <path d="M230,140 L230,230" stroke="#ffd56b" stroke-width="5" stroke-dasharray="8,5"/>
    <circle cx="230" cy="235" r="6" fill="#ffffff"/>

    <path d="M410,140 L410,230" stroke="#ffd56b" stroke-width="5" stroke-dasharray="8,5"/>
    <circle cx="410" cy="235" r="6" fill="#ffffff"/>

    <!-- Central Centerpiece Tassel -->
    <circle cx="320" cy="180" r="14" fill="#ffd56b"/>
    <circle cx="320" cy="180" r="9" fill="#e8a317"/>
    <path d="M320,194 L320,224" stroke="#ffd56b" stroke-width="4"/>
    <circle cx="320" cy="226" r="6" fill="#ffd56b"/>
  </g>

  <!-- Sacred Kuthu Vilakku (Traditional Brass Lamp) at Center -->
  <g transform="translate(320, 290)">
    <!-- Base -->
    <ellipse cx="0" cy="95" rx="42" ry="12" fill="url(#goldArchGrad)"/>
    <rect x="-8" y="30" width="16" height="65" rx="3" fill="url(#goldArchGrad)"/>
    <!-- Central Tier Discs -->
    <ellipse cx="0" cy="55" rx="22" ry="6" fill="#ffd56b"/>
    <ellipse cx="0" cy="25" rx="36" ry="10" fill="url(#goldArchGrad)"/>
    <!-- Top Crown Oil Reservoir -->
    <path d="M-28,25 C-28,10 -15,0 0,0 C15,0 28,10 28,25 Z" fill="url(#goldArchGrad)"/>
    <!-- Annam / Swan Finial -->
    <path d="M-6,0 C-10,-12 0,-24 0,-28 C5,-22 12,-16 6,0 Z" fill="#ffd56b"/>
    <!-- Sacred Flames (Deepam Glow) -->
    <!-- Center Flame -->
    <ellipse cx="0" cy="-32" rx="18" ry="24" fill="#ffd56b" opacity="0.35"/>
    <path d="M0,-42 Q-6,-30 0,-24 Q6,-30 0,-42 Z" fill="#ffffff"/>
    <!-- Left Wick Flame -->
    <path d="M-22,-2 Q-27,5 -22,10 Q-17,5 -22,-2 Z" fill="#ffe28a"/>
    <!-- Right Wick Flame -->
    <path d="M22,-2 Q27,5 22,10 Q17,5 22,-2 Z" fill="#ffe28a"/>
  </g>

  <!-- Foreground Atmospheric Stage Rim -->
  <rect x="50" y="415" width="540" height="25" rx="6" fill="#1f4d3a" opacity="0.85"/>
  <rect x="40" y="432" width="560" height="28" rx="8" fill="#173b2c"/>

  <!-- Elegant Golden Tag Overlay -->
  <g transform="translate(32, 32)">
    <rect width="180" height="34" rx="17" fill="rgba(20, 8, 12, 0.7)" stroke="#e8a317" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#e8a317"/>
    <text x="36" y="22" fill="#ffd56b" font-family="'Karla', sans-serif" font-size="12" font-weight="700" letter-spacing="1">MANDAP CRAFTSMANSHIP</text>
  </g>
</svg>
