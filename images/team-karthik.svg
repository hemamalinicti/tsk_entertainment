<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9f2"/>
      <stop offset="50%" stop-color="#f5e8ea"/>
      <stop offset="100%" stop-color="#edd5d9"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#8b5b00"/>
    </linearGradient>
    <linearGradient id="kurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e1b2e"/>
      <stop offset="100%" stop-color="#5a101d"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="160" cy="160" r="140"/>
    </clipPath>
  </defs>

  <!-- Outer Ring with Gold Accent -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <circle cx="160" cy="160" r="144" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Clipped Avatar Content -->
  <g clip-path="url(#circleClip)">
    <!-- Background Circle -->
    <rect width="320" height="320" fill="url(#avatarBg1)"/>

    <!-- Subtle Mandap Arch in Background -->
    <path d="M100,160 Q160,80 220,160" fill="none" stroke="#e8a317" stroke-width="3" opacity="0.4"/>
    <circle cx="160" cy="115" r="4" fill="#8e1b2e" opacity="0.5"/>

    <!-- Body / Formal Silk Kurta with Gold Zari Border -->
    <path d="M80,320 L95,240 Q160,225 225,240 L240,320 Z" fill="url(#kurtaGrad)"/>
    <!-- Angavastram (Silk Stole with Gold Zari) -->
    <path d="M95,240 Q120,270 125,320 L150,320 Q145,265 120,238 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M125,240 L125,320" stroke="#e8a317" stroke-width="4"/>
    <path d="M132,240 L132,320" stroke="#ffd56b" stroke-width="2"/>

    <!-- Neck & Face -->
    <rect x="142" y="185" width="36" height="45" rx="10" fill="#dfad88"/>
    <ellipse cx="160" cy="150" rx="46" ry="56" fill="#f0be97"/>

    <!-- Well-Groomed Hair -->
    <path d="M114,142 C114,92 140,84 160,84 C180,84 206,92 206,142 C206,120 195,96 160,96 C125,96 114,120 114,142 Z" fill="#2a1418"/>

    <!-- Subtle Eyebrows & Eyes -->
    <path d="M130,135 Q142,130 148,135" stroke="#2a1418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M172,135 Q178,130 190,135" stroke="#2a1418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="144" r="3.5" fill="#2a1418"/>
    <circle cx="180" cy="144" r="3.5" fill="#2a1418"/>

    <!-- Auspicious Tilak / Chandanam Accent -->
    <line x1="160" y1="114" x2="160" y2="128" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="122" r="2.5" fill="#8e1b2e"/>

    <!-- Friendly Smile & Mustache -->
    <path d="M142,168 Q160,172 178,168" stroke="#2a1418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M148,176 Q160,184 172,176" stroke="#8e1b2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Founder Badge Pin -->
  <g transform="translate(160, 290)">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#8e1b2e" stroke="#ffd56b" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Karla', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FOUNDER</text>
  </g>
</svg>
