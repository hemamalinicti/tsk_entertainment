<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBirthday" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a152e"/>
      <stop offset="50%" stop-color="#8e1b2e"/>
      <stop offset="100%" stop-color="#2a0f18"/>
    </linearGradient>
    <linearGradient id="goldGradBday" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#b27500"/>
    </linearGradient>
    <linearGradient id="balloonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
    <linearGradient id="balloonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85d75"/>
      <stop offset="100%" stop-color="#8e1b2e"/>
    </linearGradient>
    <filter id="softGlowBday" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="560" rx="20" fill="url(#bgBirthday)"/>

  <!-- Ambient Party Lights & Sparkles -->
  <g opacity="0.3" filter="url(#softGlowBday)">
    <circle cx="80" cy="140" r="35" fill="#ffd56b"/>
    <circle cx="320" cy="180" r="45" fill="#e85d75"/>
    <circle cx="160" cy="280" r="50" fill="#ffd56b"/>
    <circle cx="270" cy="360" r="40" fill="#e8a317"/>
  </g>

  <!-- Floating Confetti & Sparkles -->
  <g fill="#ffd56b" opacity="0.85">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="310" cy="110" r="3.5"/>
    <polygon points="120,200 124,204 120,208 116,204"/>
    <polygon points="280,220 285,225 280,230 275,225"/>
    <polygon points="150,110 155,114 150,118 145,114"/>
    <polygon points="250,90 254,94 250,98 246,94"/>
    <!-- Festive Stars -->
    <path d="M70,220 Q70,230 80,230 Q70,230 70,240 Q70,230 60,230 Q70,230 70,220 Z"/>
    <path d="M330,260 Q330,270 340,270 Q330,270 330,280 Q330,270 320,270 Q330,270 330,260 Z"/>
  </g>

  <!-- Festive Floating Balloons with Golden Ribbons -->
  <g>
    <!-- Balloon Strings -->
    <path d="M140,220 Q150,280 200,340" fill="none" stroke="#ffd56b" stroke-width="1.5" opacity="0.6"/>
    <path d="M260,210 Q240,275 200,340" fill="none" stroke="#ffd56b" stroke-width="1.5" opacity="0.6"/>
    <path d="M200,180 L200,340" fill="none" stroke="#ffd56b" stroke-width="1.5" opacity="0.6"/>

    <!-- Left Balloon (Rose / Kumkum) -->
    <g transform="translate(140, 180)">
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="url(#balloonGrad2)"/>
      <ellipse cx="-10" cy="-14" rx="10" ry="16" fill="#ffffff" opacity="0.35"/>
      <polygon points="-4,42 4,42 0,46" fill="#8e1b2e"/>
    </g>

    <!-- Right Balloon (Turmeric Gold) -->
    <g transform="translate(260, 170)">
      <ellipse cx="0" cy="0" rx="32" ry="40" fill="url(#balloonGrad1)"/>
      <ellipse cx="-8" cy="-12" rx="9" ry="15" fill="#ffffff" opacity="0.4"/>
      <polygon points="-4,40 4,40 0,44" fill="#b27500"/>
    </g>

    <!-- Center Grand Balloon (Golden Pearl) -->
    <g transform="translate(200, 135)">
      <ellipse cx="0" cy="0" rx="42" ry="52" fill="url(#goldGradBday)"/>
      <ellipse cx="-12" cy="-16" rx="12" ry="20" fill="#ffffff" opacity="0.45"/>
      <polygon points="-5,52 5,52 0,58" fill="#8b5b00"/>
    </g>
  </g>

  <!-- Celebratory Tiered Cake / Milestone Motif -->
  <g transform="translate(200, 310)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="70" rx="65" ry="12" fill="url(#goldGradBday)"/>
    <!-- Bottom Tier -->
    <path d="M-50,30 L-50,65 Q0,78 50,65 L50,30 Q0,42 -50,30 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="30" rx="50" ry="12" fill="#fcf4e4"/>
    <line x1="-50" y1="48" x2="50" y2="48" stroke="#e8a317" stroke-width="2.5"/>

    <!-- Top Tier -->
    <path d="M-32,-2 L-32,24 Q0,32 32,24 L32,-2 Q0,6 -32,-2 Z" fill="#8e1b2e"/>
    <ellipse cx="0" cy="-2" rx="32" ry="8" fill="#a82339"/>

    <!-- Auspicious Celebratory Candle & Flame -->
    <rect x="-3" y="-22" width="6" height="20" rx="2" fill="url(#goldGradBday)"/>
    <ellipse cx="0" cy="-30" rx="6" ry="10" fill="#ffd56b" filter="url(#softGlowBday)"/>
    <path d="M0,-36 Q-3,-28 0,-24 Q3,-28 0,-36 Z" fill="#ffffff"/>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="32" width="168" height="32" rx="16" fill="rgba(255,255,255,0.18)" backdrop-filter="blur(4px)"/>
  <text x="114" y="52" fill="#ffffff" font-family="'Karla', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">BIRTHDAYS &amp; GALAS</text>

  <!-- Caption text -->
  <text x="32" y="475" fill="url(#goldGradBday)" font-family="'Fraunces', serif" font-size="24" font-weight="700">Milestone Birthdays &amp;</text>
  <text x="32" y="505" fill="#ffffff" font-family="'Fraunces', serif" font-size="24" font-weight="700">Themed Celebrations</text>
  <text x="32" y="530" fill="rgba(255,255,255,0.75)" font-family="'Karla', sans-serif" font-size="14">1st Birthdays to 60th &amp; 80th Jubilees</text>
</svg>
